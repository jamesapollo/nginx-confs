server {
    server_name  www.shiftnimbo.mikaspay.com shiftnimbo.mikaspay.com;

    location / {
      proxy_pass http://localhost:4000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shiftnimbo.mikaspay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shiftnimbo.mikaspay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.shiftnimbo.mikaspay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = shiftnimbo.mikaspay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name shiftnimbo.mikaspay.com www.shiftnimbo.mikaspay.com;
    listen 80;
    return 404; # managed by Certbot
}
