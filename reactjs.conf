server {
    root /var/www/mikaspay/html;
    index index.html index.htm index.nginx-debian.html;

    server_name mikaspay.com www.mikaspay.com;

    location / {
      try_files $uri /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mikaspay.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mikaspay.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.mikaspay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = mikaspay.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    server_name mikaspay.com www.mikaspay.com;
    listen 80;
    return 404; # managed by Certbot




}
